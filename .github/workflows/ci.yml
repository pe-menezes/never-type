name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macos-15
          - os: macos-26
            label: macos-26
          # The toolchain docs/INSTALL.md sends people to, which nothing else
          # here covers: both runners default to a full Xcode newer than the
          # Command Line Tools on a machine that has not updated them. PR #6
          # passed on the two jobs above and did not build on Swift 6.0.3, and
          # the colleague who hit it found out by installing (docs/pitfalls.md).
          #
          # Xcode 16.2 carries Swift 6.0.3 and SDK 15.2, which is what a stale
          # Command Line Tools install gave the colleague who reported #7.
          #
          # Not Xcode 16 (Swift 6.0.0, SDK 15.0), which was the first pin here
          # and failed on 2026-09-04 with two errors in AudioRecorder.swift:402,
          # `capture of 'self' with non-sendable type 'AudioRecorder' in a
          # @Sendable closure` and the same for the AVAudioPCMBuffer. That is
          # the Sendable pitfall docs/pitfalls.md already records, appearing a
          # third time, and it has nothing to do with #7. So the real floor is
          # above 6.0.0, and build-app.sh enforces the number this job proves.
          - os: macos-15
            label: macos-15, oldest supported toolchain
            xcode: "16.2"
            expect_swift: "6.0"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Parallel Swift builds may repeat diagnostics. Gate unique source warnings.
      MAX_WARNING_DIAGNOSTICS: 4

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode ${{ matrix.xcode }}
        if: matrix.xcode
        run: |
          app="/Applications/Xcode_${{ matrix.xcode }}.app"
          if [ ! -d "$app" ]; then
            echo "::error::$app is not on this runner image. Present:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$app"

      # docs/pitfalls.md: "it compiles here" without the compiler and the SDK
      # written down is not reproducible. The report that produced this job had
      # to say "the Swift version on the CI images was not measured: the run log
      # does not print it". It prints it now, on every job.
      - name: Record the toolchain
        env:
          EXPECT_SWIFT: ${{ matrix.expect_swift }}
        run: |
          xcode-select -p
          swift --version
          echo "SDK $(xcrun --show-sdk-version)"
          if [ -n "$EXPECT_SWIFT" ]; then
            got="$(swift --version 2>&1 | sed -n 's/.*Swift version \([0-9][0-9.]*\).*/\1/p')"
            case "$got" in
              "$EXPECT_SWIFT"|"$EXPECT_SWIFT".*) echo "pinned toolchain is Swift $got, as intended" ;;
              *) echo "::error::this job exists to test Swift $EXPECT_SWIFT.x and got $got; the pin needs updating"; exit 1 ;;
            esac
          fi

      - name: Test warning fingerprint counter
        run: python3 scripts/test-count-swift-warnings.py

      - name: Bootstrap whisper.cpp and build the app
        run: |
          set -o pipefail
          swift package clean
          bash scripts/build-app.sh 2>&1 | tee "$RUNNER_TEMP/release-build.log"
          warnings="$(python3 scripts/count-swift-warnings.py "$RUNNER_TEMP/release-build.log")"
          echo "Unique release warnings: $warnings/$MAX_WARNING_DIAGNOSTICS"
          (( warnings <= MAX_WARNING_DIAGNOSTICS ))

      - name: Run Swift Testing suite
        run: |
          set -o pipefail
          swift package clean
          swift test --disable-xctest --enable-swift-testing 2>&1 | tee "$RUNNER_TEMP/debug-build.log"
          warnings="$(python3 scripts/count-swift-warnings.py "$RUNNER_TEMP/debug-build.log")"
          echo "Unique debug warnings: $warnings/$MAX_WARNING_DIAGNOSTICS"
          (( warnings <= MAX_WARNING_DIAGNOSTICS ))

      - name: Check patch hygiene
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          else
            git diff --check "$PUSH_BASE_SHA...$GITHUB_SHA"
          fi
