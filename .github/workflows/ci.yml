name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Four known diagnostics render as eight warning lines. Do not add debt.
      MAX_WARNING_LINES: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bootstrap whisper.cpp and build the app
        run: |
          set -o pipefail
          swift package clean
          bash scripts/build-app.sh 2>&1 | tee "$RUNNER_TEMP/release-build.log"
          warnings="$(grep -c 'warning:' "$RUNNER_TEMP/release-build.log" || true)"
          echo "Release warning lines: $warnings/$MAX_WARNING_LINES"
          (( warnings <= MAX_WARNING_LINES ))

      - name: Run Swift Testing suite
        run: |
          set -o pipefail
          swift package clean
          swift test --disable-xctest --enable-swift-testing 2>&1 | tee "$RUNNER_TEMP/debug-build.log"
          warnings="$(grep -c 'warning:' "$RUNNER_TEMP/debug-build.log" || true)"
          echo "Debug warning lines: $warnings/$MAX_WARNING_LINES"
          (( warnings <= MAX_WARNING_LINES ))

      - name: Check patch hygiene
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          else
            git diff --check "$PUSH_BASE_SHA...$GITHUB_SHA"
          fi
